<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <title>Echo Audio Capture</title>
    <!-- Google Fonts: Inter and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard-grid">
        
        <!-- Sidebar -->
        <aside class="sidebar glass-effect">
            <div class="brand">
                <h1>Echo</h1>
                <div class="status-indicator-box">
                    <div class="indicator" id="indicator"></div>
                    <span id="mode">Initializing...</span>
                </div>
            </div>

            <div class="controls-stack">
                <button id="btn-record-toggle" class="btn primary">Start Recording</button>
                <button id="btn-play" class="btn secondary">Play</button>
                <button id="btn-transcribe" class="btn transcribe">Transcribe</button>
            </div>

            <!-- Enhanced Results Navigation -->
            <div class="nav-group">
                <span class="nav-label">Results</span>
                <button class="nav-btn" id="nav-home" onclick="switchView('home')">Live Notes</button>
                <button class="nav-btn hidden" id="nav-transcript" onclick="switchView('transcript')">Transcript</button>
                <button class="nav-btn hidden" id="nav-raw-notes" onclick="switchView('raw-notes')">Raw Notes</button>
                <button class="nav-btn hidden" id="nav-enhanced" onclick="switchView('enhanced')">Enhanced Notes</button>
                <button class="nav-btn hidden" id="nav-summary" onclick="switchView('summary')">Summary</button>
                <button class="nav-btn hidden" id="nav-decisions" onclick="switchView('decisions')">Decisions</button>
                <button class="nav-btn hidden" id="nav-actions" onclick="switchView('actions')">Action Items</button>
            </div>
        </aside>

        <!-- Main Content (Center) -->
        <main class="main-content glass-effect">
            
            <!-- VIEW: Home (Live Notes) -->
            <div id="view-home" class="view-section active">
                <div class="notes-header">
                    <h2>Live Session Notes</h2>
                </div>
                <div class="notes-container">
                    <!-- Rich Text Editor -->
                     <div class="rich-editor-container">
                        <div class="editor-toolbar">
                            <button class="toolbar-btn" onclick="formatDoc('bold')" title="Bold">
                                <b>B</b>
                            </button>
                            <button class="toolbar-btn" onclick="formatDoc('italic')" title="Italic">
                                <i>I</i>
                            </button>
                            <button class="toolbar-btn" onclick="formatDoc('underline')" title="Underline">
                                <u>U</u>
                            </button>
                            <span class="separator">|</span>
                            <button class="toolbar-btn" onclick="formatDoc('strikeThrough')" title="Strikethrough">
                                <s>S</s>
                            </button>
                            <span class="separator">|</span>
                            <button class="toolbar-btn" onclick="formatDoc('justifyLeft')" title="Align Left">
                                <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><line x1="21" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
                            </button>
                            <button class="toolbar-btn" onclick="formatDoc('justifyCenter')" title="Align Center">
                                <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><line x1="21" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
                            </button>
                            <button class="toolbar-btn" onclick="formatDoc('justifyRight')" title="Align Right">
                                <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><line x1="21" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
                            </button>
                            <span class="separator">|</span>
                            <button class="toolbar-btn" onclick="formatDoc('insertOrderedList')" title="Ordered List">
                                <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>
                            </button>
                            <button class="toolbar-btn" onclick="formatDoc('insertUnorderedList')" title="Unordered List">
                                <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                            </button>
                        </div>
                        <div id="notes-input" class="editor-content" contenteditable="true" spellcheck="false"></div>
                        <div id="editor-placeholder" class="editor-placeholder">Type your notes here while recording...</div>
                    </div>
                </div>
            </div>

            <!-- VIEW: Transcript -->
            <div id="view-transcript" class="view-section">
                <div class="notes-header">
                    <h2>Transcript</h2>
                    <span class="badge">Raw Audio</span>
                </div>
                <div id="chat-box" class="chat-box" style="height: 100%; overflow-y: auto;"></div>
            </div>

            <!-- VIEW: Raw Notes -->
            <div id="view-raw-notes" class="view-section">
                <div class="notes-header">
                    <h2>Raw Notes</h2>
                    <span class="badge">Original</span>
                </div>
                <div id="content-raw-notes" style="white-space: pre-wrap; line-height: 1.6; overflow-y: auto;"></div>
            </div>

            <!-- VIEW: Enhanced Notes -->
            <div id="view-enhanced" class="view-section">
                <div class="notes-header">
                    <h2>Enhanced Notes</h2>
                    <span class="badge">AI Polished</span>
                </div>
                <div id="content-enhanced" style="white-space: pre-wrap; line-height: 1.6; overflow-y: auto;"></div>
            </div>

            <!-- VIEW: Summary -->
            <div id="view-summary" class="view-section">
                <div class="notes-header">
                    <h2>Session Summary</h2>
                    <span class="badge">Overview</span>
                </div>
                <div id="content-summary" style="font-size: 1.1rem; line-height: 1.6;"></div>
            </div>

            <!-- VIEW: Decisions -->
            <div id="view-decisions" class="view-section">
                <div class="notes-header">
                    <h2>Key Decisions</h2>
                    <span class="badge">Agreed</span>
                </div>
                <div id="content-decisions" style="line-height: 1.8;"></div>
            </div>

            <!-- VIEW: Actions -->
            <div id="view-actions" class="view-section">
                <div class="notes-header">
                    <h2>Action Items</h2>
                    <span class="badge">To Do</span>
                </div>
                <div id="content-actions" style="line-height: 1.8;"></div>
            </div>

        </main>

        <!-- Footer Actions -->
        <footer class="action-footer">
            <button id="btn-download" class="btn-download hidden">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download
            </button>
        </footer>

    </div>

    <script src="renderer.js"></script>
  </body>
</html>
